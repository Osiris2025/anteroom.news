# homelab2 · Anteroom public site
# mirrors homelab1's proven pattern: cloudflared -> traefik(web:80) -> app
# DB reaches homelab1's nexus-postgres over tailscale at 100.65.69.37:5432

services:
  traefik:
    image: traefik:v3.1
    container_name: anchor-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.file.directory=/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${CLOUDFLARE_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
    environment:
      - CF_DNS_API_TOKEN=${CLOUDFLARE_API_KEY}
      - CLOUDFLARE_EMAIL=${CLOUDFLARE_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./traefik/dynamic:/dynamic:ro
      - ./traefik/letsencrypt:/letsencrypt
    networks:
      - default

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: anteroom-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - traefik
    networks:
      - default

  anteroom-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: anteroom-frontend
    restart: unless-stopped
    environment:
      HOSTNAME: "0.0.0.0"
      # homelab1 Postgres over the tailnet (socat forward on homlab1 :5432 -> 5433)
      DATABASE_URL: postgresql://nexus:changeme@100.65.69.37:5432/nexus
      AUTH_URL: https://anteroom.news
      NEXT_PUBLIC_AUTH_URL: https://anteroom.news
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SITE_BASE_URL: https://anteroom.news
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.anteroom.rule=Host(`anteroom.news`)"
      - "traefik.http.routers.anteroom.entrypoints=web"
      - "traefik.http.services.anteroom.loadbalancer.server.port=3000"
    networks:
      - default

  preview-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: preview-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3001"
      DATABASE_URL: postgresql://nexus:changeme@100.65.69.37:5432/nexus
      AUTH_URL: https://preview.anteroom.news
      NEXT_PUBLIC_AUTH_URL: https://preview.anteroom.news
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SITE_BASE_URL: https://preview.anteroom.news
      USE_DB_IDENTITY: ${USE_DB_IDENTITY:-0}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.anteroom-preview.rule=Host(`preview.anteroom.news`)"
      - "traefik.http.routers.anteroom-preview.entrypoints=web"
      - "traefik.http.services.anteroom-preview.loadbalancer.server.port=3001"
    networks:
      - default

networks:
  default:
    name: homelab_default