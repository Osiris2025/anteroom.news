version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: nexus-db
    volumes:
      - nexus_pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${NEXUS_DB_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 10s

  engine:
    build: ./engine
    container_name: nexus-engine
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./streams:/app/streams:ro
      - ./engine/src:/app/src
    restart: unless-stopped

volumes:
  nexus_pgdata:
