<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI News Nexus — 10 Design Variants</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=DM+Serif+Display:ital@0;1&family=Playfair+Display:wght@400;700;900&family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;line-height:1.5;transition:none}

/* Theme selector */
.ts{position:fixed;top:0;left:0;right:0;z-index:9999;display:flex;align-items:center;gap:6px;padding:6px 16px;font-size:12px;background:#111;color:#ccc;border-bottom:1px solid #333;flex-wrap:wrap}
.ts select{padding:4px 8px;font-size:12px;border-radius:4px;background:#222;color:#eee;border:1px solid #444;cursor:pointer;font-family:Inter}
.ts .count{font-family:JetBrains Mono;font-size:10px;color:#666;margin-left:auto}

/* =============== 1. LINEAR =============== */
body.l1{background:#08090a;color:#f7f8f8;font-family:Inter}
body.l1 .container{max-width:1280px;margin:0 auto;padding:56px 24px 24px}
body.l1 .flex-row{display:flex;gap:32px}
body.l1 .sidebar-l{width:220px;flex-shrink:0;position:sticky;top:56px;height:calc(100vh-56px);overflow-y:auto;padding-right:16px}
body.l1 .sidebar-l .logo{margin-bottom:28px}
body.l1 .sidebar-l .logo span{color:#7170ff}
body.l1 .sidebar-l nav{display:flex;flex-direction:column;gap:4px}
body.l1 .sidebar-l nav a{color:#8a8f98;text-decoration:none;padding:8px 12px;border-radius:6px;font-size:13px;font-weight:500}
body.l1 .sidebar-l nav a:hover{background:rgba(255,255,255,0.04);color:#f7f8f8}
body.l1 .main{flex:1}
body.l1 .header{border-bottom:1px solid rgba(255,255,255,0.05);padding-bottom:16px;margin-bottom:24px}
body.l1 .header .h-top{display:flex;justify-content:space-between;align-items:center}
body.l1 .header .h-top .greeting{color:#8a8f98;font-size:13px}
body.l1 .hero{padding:32px 0}
body.l1 .hero h1{font-size:40px;font-weight:600;letter-spacing:-.88px;line-height:1.1;margin-bottom:8px}
body.l1 .hero p{color:#8a8f98;font-size:14px;max-width:500px}
body.l1 .section{margin-bottom:32px}
body.l1 .section .sh{display:flex;align-items:center;gap:8px;margin-bottom:12px}
body.l1 .section .sh h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:#62666d}
body.l1 .card-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
body.l1 .card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:14px}
body.l1 .card .lbl{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
body.l1 .card h3{font-size:13px;font-weight:500;line-height:1.3;letter-spacing:-.13px;margin-bottom:3px}
body.l1 .card p{font-size:11px;color:#8a8f98}
body.l1 .card .meta{font-size:10px;color:#62666d;margin-top:4px}
body.l1 .card.featured{border-left:3px solid #7170ff}
body.l1 .sidebar-r{width:260px;flex-shrink:0}
body.l1 .sb-w{border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:14px;margin-bottom:10px;background:rgba(255,255,255,0.02)}
body.l1 .sb-w h3{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:#62666d;margin-bottom:8px}
body.l1 .sb-w li{padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:11px;color:#8a8f98}
body.l1 .footer{border-top:1px solid rgba(255,255,255,0.05);padding-top:16px;margin-top:32px;display:flex;justify-content:space-between;font-size:11px;color:#62666d}

/* =============== 2. VERCEL =============== */
body.l2{background:#fff;color:#171717;font-family:Inter}
body.l2 .container{max-width:1200px;margin:0 auto;padding:56px 24px 24px}
body.l2 .flex-row{display:flex;gap:40px}
body.l2 .sidebar-l{width:200px;flex-shrink:0}
body.l2 .sidebar-l .logo{font-size:18px;font-weight:600;letter-spacing:-.36px;margin-bottom:24px}
body.l2 .sidebar-l .logo span{color:#0072f5}
body.l2 .sidebar-l nav a{display:block;padding:6px 0;color:#666;text-decoration:none;font-size:13px;font-weight:500;border-bottom:1px solid #f0f0f0}
body.l2 .sidebar-l nav a:hover{color:#171717}
body.l2 .main{flex:1}
body.l2 .hero{padding:24px 0 32px;border-bottom:1px solid #f0f0f0;margin-bottom:24px}
body.l2 .hero h1{font-size:36px;font-weight:600;letter-spacing:-1.8px;line-height:1.05}
body.l2 .hero p{color:#666;font-size:14px;margin-top:4px}
body.l2 .section{margin-bottom:28px}
body.l2 .section .sh{margin-bottom:12px}
body.l2 .section .sh h2{font-size:13px;font-weight:600;letter-spacing:-.26px}
body.l2 .card-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
body.l2 .card{padding:16px;border-radius:6px;box-shadow:0 0 0 1px rgba(0,0,0,0.08),0 2px 2px rgba(0,0,0,0.04),#fafafa 0 0 0 1px}
body.l2 .card h3{font-size:14px;font-weight:600;letter-spacing:-.28px;margin-bottom:3px}
body.l2 .card p{font-size:12px;color:#666}
body.l2 .card .meta{font-size:11px;color:#999;margin-top:4px}
body.l2 .card .lbl{font-size:10px;font-weight:600;margin-bottom:4px}
body.l2 .sidebar-r{width:240px;flex-shrink:0}
body.l2 .sb-w{padding:16px;margin-bottom:10px;box-shadow:0 0 0 1px rgba(0,0,0,0.08),0 2px 2px rgba(0,0,0,0.04);border-radius:6px}
body.l2 .sb-w h3{font-size:11px;font-weight:600;color:#666;margin-bottom:8px;letter-spacing:-.22px}
body.l2 .sb-w li{padding:6px 0;border-bottom:1px solid #f0f0f0;font-size:12px;color:#4d4d4d}
body.l2 .footer{border-top:1px solid #f0f0f0;padding-top:16px;margin-top:32px;display:flex;justify-content:space-between;font-size:11px;color:#999}

/* =============== 3. TABLOID =============== */
body.l3{background:#f5f0e8;color:#2a2216;font-family:'DM Serif Display',Georgia,serif}
body.l3 .container{max-width:1100px;margin:0 auto;padding:56px 16px 24px}
body.l3 .banner{background:#c1121f;color:#fff;text-align:center;padding:6px;font-size:11px;font-family:Inter;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:16px}
body.l3 .masthead{text-align:center;border-bottom:3px double #2a2216;padding-bottom:8px;margin-bottom:16px}
body.l3 .masthead h1{font-size:52px;font-weight:900;letter-spacing:-1px;line-height:1;font-family:'Playfair Display',serif}
body.l3 .masthead .edition{font-size:10px;font-family:Inter;color:#666;text-transform:uppercase;letter-spacing:1px;margin-top:2px}
body.l3 .flex-row{display:flex;gap:24px}
body.l3 .main{flex:1}
body.l3 .lead-story{border-bottom:2px solid #2a2216;padding-bottom:12px;margin-bottom:12px}
body.l3 .lead-story h1{font-size:36px;font-weight:900;line-height:1.05;margin-bottom:4px}
body.l3 .lead-story h1 span{color:#c1121f}
body.l3 .lead-story p{font-family:Inter;font-size:13px;color:#444;line-height:1.4}
body.l3 .news-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
body.l3 .news-card{border-bottom:1px solid #ccc;padding-bottom:10px;margin-bottom:10px}
body.l3 .news-card .lbl{font-family:Inter;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#c1121f;margin-bottom:2px}
body.l3 .news-card h3{font-size:18px;font-weight:700;line-height:1.15;margin-bottom:3px}
body.l3 .news-card p{font-family:Inter;font-size:12px;color:#555}
body.l3 .news-card .meta{font-family:Inter;font-size:10px;color:#888;margin-top:3px}
body.l3 .sidebar-r{width:260px;flex-shrink:0;padding-left:16px;border-left:1px solid #ccc}
body.l3 .sb-w{margin-bottom:16px}
body.l3 .sb-w h3{font-family:Inter;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#c1121f;border-bottom:1px solid #2a2216;padding-bottom:4px;margin-bottom:8px}
body.l3 .sb-w li{font-family:Inter;font-size:12px;padding:5px 0;border-bottom:1px solid #e0d8cc;color:#2a2216}
body.l3 .sb-w .btn{display:block;width:100%;padding:8px;font-family:Inter;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;background:#2a2216;color:#f5f0e8;border:none;cursor:pointer;margin-top:6px}
body.l3 .footer{border-top:2px solid #2a2216;padding-top:12px;margin-top:24px;display:flex;justify-content:space-between;font-family:Inter;font-size:10px;color:#888}

/* =============== 4. MAGAZINE =============== */
body.l4{background:#fff;color:#1a1a1a;font-family:'Space Grotesk',sans-serif}
body.l4 .container{max-width:1120px;margin:0 auto;padding:56px 24px 24px}
body.l4 .crawl{background:#0a0a0a;color:#0f0;font-family:'IBM Plex Mono',monospace;font-size:11px;padding:6px 16px;overflow:hidden;white-space:nowrap;margin-bottom:16px;border-radius:4px}
body.l4 .crawl span{display:inline-block;animation:marquee 30s linear infinite}
@keyframes marquee{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
body.l4 .masthead{text-align:center;margin-bottom:24px}
body.l4 .masthead h1{font-size:28px;font-weight:700;letter-spacing:-.56px}
body.l4 .masthead h1 span{background:linear-gradient(135deg,#ff6b6b,#ee5a24);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
body.l4 .masthead .nav{display:flex;justify-content:center;gap:20px;margin-top:8px}
body.l4 .masthead .nav a{color:#666;text-decoration:none;font-size:12px;font-weight:500}
body.l4 .flex-row{display:flex;gap:32px}
body.l4 .main{flex:2}
body.l4 .hero-card{background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;border-radius:16px;padding:32px;margin-bottom:24px}
body.l4 .hero-card .lbl{font-size:10px;text-transform:uppercase;letter-spacing:2px;opacity:.6;margin-bottom:8px}
body.l4 .hero-card h1{font-size:32px;font-weight:700;line-height:1.1;margin-bottom:8px}
body.l4 .hero-card p{font-size:13px;opacity:.8;line-height:1.5}
body.l4 .card-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
body.l4 .card{background:#f8f9fa;border-radius:12px;padding:20px;transition:transform.2s}
body.l4 .card:hover{transform:translateY(-2px)}
body.l4 .card .lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
body.l4 .card h3{font-size:16px;font-weight:600;line-height:1.2;margin-bottom:4px}
body.l4 .card p{font-size:13px;color:#666;line-height:1.4}
body.l4 .card .meta{font-size:11px;color:#999;margin-top:4px}
body.l4 .sidebar-r{flex:1;min-width:240px}
body.l4 .sb-w{background:#f8f9fa;border-radius:12px;padding:20px;margin-bottom:16px}
body.l4 .sb-w h3{font-size:12px;font-weight:700;margin-bottom:10px;letter-spacing:-.24px}
body.l4 .sb-w li{padding:8px 0;border-bottom:1px solid #e8e8e8;font-size:13px;color:#4a4a4a}
body.l4 .sb-w input{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:inherit;margin-bottom:8px}
body.l4 .sb-w .btn{width:100%;padding:10px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer}
body.l4 .footer{border-top:1px solid #eee;padding-top:16px;margin-top:32px;display:flex;justify-content:space-between;font-size:12px;color:#999}

/* =============== 5. TERMINAL =============== */
body.l5{background:#0d0d0d;color:#0f0;font-family:'IBM Plex Mono',monospace;font-size:13px}
body.l5 .container{max-width:1100px;margin:0 auto;padding:56px 16px 24px}
body.l5 .header-line{color:#ff0;margin-bottom:8px;white-space:pre}
body.l5 .prompt{color:#0f0;margin-bottom:4px}
body.l5 .prompt span{color:#0ff}
body.l5 .flex-row{display:flex;gap:24px}
body.l5 .main{flex:1}
body.l5 .section{margin-bottom:20px}
body.l5 .section .sh{color:#0ff;font-weight:700;margin-bottom:8px}
body.l5 .card{border:1px solid #0f0;padding:10px 12px;margin-bottom:8px}
body.l5 .card .lbl{color:#ff0;font-size:11px}
body.l5 .card h3{color:#fff;font-weight:700;margin-bottom:3px}
body.l5 .card p{color:#0a0}
body.l5 .card .meta{color:#060;font-size:11px;margin-top:3px}
body.l5 .card.featured{border-color:#ff0;background:rgba(255,255,0,0.03)}
body.l5 .sidebar-r{width:260px;flex-shrink:0}
body.l5 .sb-w{border:1px solid #0f0;padding:12px;margin-bottom:10px}
body.l5 .sb-w h3{color:#ff0;margin-bottom:6px}
body.l5 .sb-w li{padding:4px 0;border-bottom:1px solid #060;color:#0a0}
body.l5 .sb-w .btn{width:100%;padding:8px;background:#0f0;color:#000;border:none;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;margin-top:6px}
body.l5 .footer{border-top:1px solid #0f0;padding-top:10px;margin-top:20px;display:flex;justify-content:space-between;font-size:11px;color:#060}

/* =============== 6. CARD WALL =============== */
body.l6{background:#f0f2f5;color:#1a1a2e;font-family:Inter}
body.l6 .container{max-width:1200px;margin:0 auto;padding:56px 16px 24px}
body.l6 .header{text-align:center;margin-bottom:24px}
body.l6 .header h1{font-size:32px;font-weight:800;letter-spacing:-.64px}
body.l6 .header .crawl{font-size:11px;color:#666;margin-top:4px}
body.l6 .masonry{column-count:3;column-gap:16px}
body.l6 .card{break-inside:avoid;margin-bottom:16px;background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.06);display:inline-block;width:100%}
body.l6 .card.wide{column-span:all}
body.l6 .card .lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
body.l6 .card h3{font-size:16px;font-weight:700;line-height:1.2;margin-bottom:4px}
body.l6 .card p{font-size:13px;color:#555}
body.l6 .card .meta{font-size:11px;color:#999;margin-top:6px}
body.l6 .card.big{padding:28px}
body.l6 .card.big h3{font-size:22px}
body.l6 .card .poll-btn{display:block;width:100%;padding:10px;margin-bottom:6px;border:1px solid #e0e0e0;border-radius:10px;background:#f8f8f8;text-align:left;font-size:13px;cursor:pointer;font-family:inherit}
body.l6 .card .poll-btn:hover{background:#eef0ff;border-color:#667eea}
body.l6 .card .sub-input{width:100%;padding:10px;border:1px solid #e0e0e0;border-radius:10px;font-size:13px;margin-bottom:6px;font-family:inherit}
body.l6 .card .sub-btn{width:100%;padding:10px;background:#1a1a2e;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
body.l6 .footer{text-align:center;padding-top:24px;margin-top:24px;border-top:1px solid #e0e0e0;font-size:12px;color:#999}

/* =============== 7. NEWS CRAWLER =============== */
body.l7{background:#111;color:#eee;font-family:Inter}
body.l7 .crawl-bar{background:#c1121f;color:#fff;padding:4px 0;overflow:hidden;white-space:nowrap;font-size:12px;font-weight:600;position:fixed;top:40px;left:0;right:0;z-index:999}
body.l7 .crawl-bar span{display:inline-block;animation:marquee2 25s linear infinite;padding-left:100%}
@keyframes marquee2{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
body.l7 .container{max-width:1280px;margin:0 auto;padding:80px 16px 16px}
body.l7 .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
body.l7 .logo{font-size:22px;font-weight:700;letter-spacing:-.44px}
body.l7 .logo span{color:#ff4d4d}
body.l7 .nav{display:flex;gap:16px}
body.l7 .nav a{color:#888;text-decoration:none;font-size:12px;font-weight:500}
body.l7 .flex-row{display:flex;gap:24px}
body.l7 .main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px}
body.l7 .card{background:#1a1a1a;border-radius:4px;padding:14px;border-left:3px solid #ff4d4d}
body.l7 .card.poli{border-left-color:#a78bfa}
body.l7 .card.tech{border-left-color:#60a5fa}
body.l7 .card .lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
body.l7 .card h3{font-size:13px;font-weight:600;margin-bottom:3px}
body.l7 .card p{font-size:11px;color:#888}
body.l7 .card .meta{font-size:10px;color:#555;margin-top:3px}
body.l7 .sidebar-r{width:280px;flex-shrink:0}
body.l7 .sb-w{background:#1a1a1a;border-radius:4px;padding:14px;margin-bottom:10px}
body.l7 .sb-w h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#ff4d4d;margin-bottom:8px}
body.l7 .sb-w li{padding:5px 0;border-bottom:1px solid #2a2a2a;font-size:12px;color:#aaa}
body.l7 .sb-w .btn{width:100%;padding:8px;background:#ff4d4d;color:#fff;border:none;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer}
body.l7 .footer{border-top:1px solid #2a2a2a;padding-top:12px;margin-top:20px;display:flex;justify-content:space-between;font-size:11px;color:#555}

/* =============== 8. MINIMAL BLOG =============== */
body.l8{background:#fafafa;color:#333;font-family:Inter}
body.l8 .container{max-width:720px;margin:0 auto;padding:56px 16px 24px}
body.l8 .header{text-align:center;margin-bottom:40px}
body.l8 .header h1{font-size:24px;font-weight:300;letter-spacing:2px;text-transform:uppercase;color:#999}
body.l8 .header .nav{display:flex;justify-content:center;gap:24px;margin-top:12px}
body.l8 .header .nav a{color:#ccc;text-decoration:none;font-size:12px;font-weight:500}
body.l8 .hero{margin-bottom:40px;padding-bottom:24px;border-bottom:1px solid #eee}
body.l8 .hero h1{font-size:28px;font-weight:500;line-height:1.25;margin-bottom:8px}
body.l8 .hero p{font-size:14px;color:#888;line-height:1.6}
body.l8 .card{padding:20px 0;border-bottom:1px solid #f0f0f0}
body.l8 .card .lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:#999;margin-bottom:4px}
body.l8 .card h3{font-size:20px;font-weight:500;line-height:1.2;margin-bottom:4px}
body.l8 .card p{font-size:14px;color:#777;line-height:1.5}
body.l8 .card .meta{font-size:12px;color:#bbb;margin-top:4px}
body.l8 .sidebar{background:#f5f5f5;border-radius:12px;padding:20px;margin:24px 0}
body.l8 .sidebar h3{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:#999;margin-bottom:8px}
body.l8 .sidebar li{padding:6px 0;font-size:13px;color:#666}
body.l8 .sidebar input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:13px;margin-bottom:6px;font-family:inherit}
body.l8 .sidebar .btn{width:100%;padding:10px;background:#333;color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer}
body.l8 .footer{text-align:center;padding-top:24px;margin-top:24px;font-size:12px;color:#ccc}

/* =============== 9. DASHBOARD =============== */
body.l9{background:#0a0e17;color:#c8d6e5;font-family:Inter}
body.l9 .container{max-width:1400px;margin:0 auto;padding:56px 16px 16px}
body.l9 .top-row{display:flex;gap:12px;margin-bottom:16px}
body.l9 .stat{background:#111927;border:1px solid #1e2a3e;border-radius:8px;padding:14px 16px;flex:1}
body.l9 .stat .val{font-size:28px;font-weight:700;color:#fff}
body.l9 .stat .lbl{font-size:11px;color:#5a6a8a;margin-top:2px}
body.l9 .flex-row{display:flex;gap:16px}
body.l9 .main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px}
body.l9 .card{background:#111927;border:1px solid #1e2a3e;border-radius:6px;padding:12px}
body.l9 .card .lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#5a6a8a;margin-bottom:3px}
body.l9 .card h3{font-size:12px;font-weight:600;color:#fff;margin-bottom:2px}
body.l9 .card p{font-size:11px;color:#5a6a8a}
